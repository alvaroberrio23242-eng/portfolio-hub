<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demasiados intentos — Álvaro Berrío</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0D12;
    --surface: #13161D;
    --line: #262B36;
    --text: #EDEAE2;
    --muted: #8A8F9C;
    --amber: #E3A24C;
    --teal: #46D7C0;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .err-wrap{
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 48px 28px;
  }
  .err-code{
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--amber); margin: 0 0 16px;
  }
  h1{
    font-family: 'Fraunces', serif; font-size: clamp(28px, 6vw, 44px);
    font-weight: 600; margin: 0 0 12px; max-width: 24ch;
  }
  p{
    font-size: 15px; color: var(--muted); margin: 0 0 28px; max-width: 48ch;
    line-height: 1.65;
  }
  .actions{ display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn{
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    letter-spacing: .03em; padding: 12px 22px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--text);
    text-decoration: none; background: none; cursor: pointer;
    transition: all .2s ease;
  }
  .btn:hover{ border-color: var(--muted); }
  .btn-primary{ background: var(--amber); border-color: var(--amber); color: var(--bg); font-weight: 600; }
  .btn-primary:hover{ background: transparent; color: var(--amber); }
  footer{
    padding: 26px 0 40px; border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--muted); text-align: center;
  }
  :focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }
</style>
</head>
<body>
<main class="err-wrap">
  <p class="err-code">Error 429</p>
  <h1>Demasiados intentos</h1>
  <p>Superaste el límite de intentos de acceso. Espera un minuto antes de volver a intentar.</p>
  <div class="actions">
    <a class="btn btn-primary" href="{{ url_for('index') }}">Volver al portafolio</a>
  </div>
</main>
<footer>© 2026 Álvaro Berrío</footer>
</body>
</html>
