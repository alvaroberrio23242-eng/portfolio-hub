<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Berrío Digital Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0D12;
    --surface: #13161D;
    --line: #262B36;
    --text: #EDEAE2;
    --muted: #8A8F9C;
    --amber: #E3A24C;
    --teal: #46D7C0;
    --magenta: #E34C9E;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-wrap{
    max-width: 380px;
    width: 100%;
    padding: 0 28px;
  }
  .login-logo{
    font-family: 'Fraunces', serif;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: .04em;
    margin-bottom: 32px;
    text-align: center;
  }
  .login-logo strong{ color: var(--text); }
  h2{
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 24px;
    text-align: center;
  }
  .login-error{
    background: rgba(227,76,158,.1);
    border: 1px solid var(--magenta);
    color: var(--magenta);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .login-field{
    margin-bottom: 14px;
  }
  .login-field label{
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .login-field input{
    width: 100%;
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    outline: none;
    transition: border-color .2s ease;
  }
  .login-field input:focus{
    border-color: var(--amber);
  }
  .login-btn{
    width: 100%;
    padding: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: .04em;
    background: var(--amber);
    border: 1px solid var(--amber);
    border-radius: 8px;
    color: var(--bg);
    font-weight: 600;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
    margin-top: 6px;
  }
  .login-btn:hover{
    background: transparent;
    color: var(--amber);
  }
  .login-back{
    display: block;
    text-align: center;
    margin-top: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
  }
  .login-back:hover{ color: var(--text); }
  :focus-visible{
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <p class="login-logo"><strong>BERRÍO DIGITAL LAB</strong></p>
    <h2>Acceso privado</h2>
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('login') }}">
      <div class="login-field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="login-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="login-btn">Entrar</button>
    </form>
    <a href="{{ url_for('index') }}" class="login-back">← Volver al portafolio</a>
  </div>
</body>
</html>
